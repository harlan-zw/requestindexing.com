name: CI

# The pull request gate. Required checks stay under `harlan-desktop / *`, and
# the `changes` job skips them on non-rendered docs PRs so required checks still
# report instead of hanging.
#
# The jobs live in harlan-zw/harlan-nuxt so every site shares one pinned copy.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # GitHub-hosted for the same reason as the checks: this repository is public.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Run the checks when any changed file is code, or site content that renders.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE...$HEAD")
          code=false
          while IFS= read -r file; do
            case "$file" in
              apps/marketing/content/*) code=true; break ;;
              *.md|docs/*|.editorconfig|.gitignore|.idea/*|.vscode/*|'') ;;
              *) code=true; break ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  harlan-desktop:
    needs: changes
    if: ${{ !cancelled() }}
    uses: harlan-zw/harlan-nuxt/.github/workflows/harlan-desktop-site-ci.yml@main
    with:
      node-version: 26.13.0
      skip: ${{ needs.changes.outputs.code == 'false' }}
      # GitHub-hosted on purpose. This repository is public, and a self-hosted
      # runner on a public repository lets a fork pull request run code on the
      # workstation.
      runs-on: '["ubuntu-24.04"]'
      # `postinstall` runs `nuxt prepare`, which typecheck resolves aliases
      # through.
      install-args: ''
      # NOT `pnpm lint`. That script is `eslint . --fix`, which rewrites the
      # working tree and then reports success, so as a gate it can never fail.
      lint-command: pnpm exec eslint .
      test-command: pnpm test
      typecheck-node-options: --max-old-space-size=16384
      timeout-minutes: 30

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=16384
      - run: pnpm check:agent-surface
      - name: Verify Worker startup and bundle
        run: |
          pnpm exec wrangler --cwd .output check startup --outfile "$RUNNER_TEMP/worker-startup.cpuprofile"
          pnpm exec wrangler --cwd .output deploy --dry-run
