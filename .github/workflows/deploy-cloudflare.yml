name: Deploy to Cloudflare

# Runs only after CI passes on main. Before, this workflow built and shipped every
# push to main with no check of any kind in front of it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare-production
  # A deploy in flight must finish. Wrangler uploads and activates a Worker
  # version, and cancelling part-way leaves it uploaded but not activated.
  cancel-in-progress: false

jobs:
  deploy:
    # `github.sha` is the default branch tip for a `workflow_run` event, not the
    # commit the run covered, so it cannot be compared against `head_sha` and
    # cannot be checked out. Use `head_sha` throughout.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Both steps below needed almost the same secrets, so the list was written
    # twice and had already diverged: the build carried
    # NUXT_OAUTH_GOOGLE_CLIENT_ID, NUXT_UI_PRO_LICENSE, and SENTRY_AUTH_TOKEN
    # that the deploy did not. One job-level block cannot drift against itself.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NUXT_DATAFORSEO_LOGIN: ${{ secrets.NUXT_DATAFORSEO_LOGIN }}
      NUXT_DATAFORSEO_PASSWORD: ${{ secrets.NUXT_DATAFORSEO_PASSWORD }}
      NUXT_GSCDUMP_API_KEY: ${{ secrets.NUXT_GSCDUMP_API_KEY }}
      NUXT_GSCDUMP_WEBHOOK_SECRET: ${{ secrets.NUXT_GSCDUMP_WEBHOOK_SECRET }}
      NUXT_KEY: ${{ secrets.NUXT_KEY }}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_ID }}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_SECRET }}
      NUXT_OAUTH_POOL: ${{ secrets.NUXT_OAUTH_POOL }}
      NUXT_OAUTH_PRIVATE_POOL: ${{ secrets.NUXT_OAUTH_PRIVATE_POOL }}
      NUXT_POSTMARK_API_KEY: ${{ secrets.NUXT_POSTMARK_API_KEY }}
      NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main
        with:
          # `postinstall` runs `nuxt prepare`, which the build depends on.
          install-args: ''

      # Accumulates prior deploys' client chunks so a browser session opened
      # before the rollout still resolves its old `_nuxt` chunks
      # (nuxt-skew-protection, fs storage). Keyed per commit so each build saves
      # a fresh entry; the prefix restore-key picks up the accumulated set.
      - name: Cache for Nuxt SEO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            nuxt-skew-

      - run: pnpm build
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=16384
          # `GITHUB_SHA` is the default branch tip on a `workflow_run` event, so
          # the release named a commit this build does not contain. Sentry then
          # blamed live errors on code that was never deployed.
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Turns the onboarding drip on in production. `nuxt.config.ts` writes
          # it into the Worker vars at build time. A build without it deploys
          # the drip off. The daily bulk sync keeps its own switch,
          # NUXT_NOTIFICATIONS_ENABLED, which this workflow leaves unset.
          NUXT_ONBOARDING_DRIP_ENABLED: 'true'

      # Schema before code. On 2026-09-15 a deploy shipped code that reads
      # migration 0014's `sites` columns while production D1 still held the old
      # table. The gscdump webhook and site registration failed for two hours.
      #
      # Wrangler records each applied file in the `d1_migrations` table, so this
      # step is a no-op when nothing is pending, and it auto-confirms in CI.
      #
      # A failure here stops the deploy on purpose. Shipping code past a
      # migration that did not apply is the exact fault this step prevents.
      #
      # `secrets.CLOUDFLARE_API_TOKEN` needs "D1: Edit". A Workers-only token
      # returns 7403 before wrangler even reads the pending list, which once
      # blocked every deploy (run 31679455527).
      - name: Apply D1 migrations
        timeout-minutes: 10
        run: pnpm db:migrate

      - run: pnpm deploy

      # Reuse the deploy build. Reporting errors must not change deployment status.
      - name: Report Nuxt DX budget
        id: dx_budget
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@36d8fbf0dec7a829f63683abbf1fdc6efa2e6697
        with:
          artifact-name: nuxt-dx-size-budget-v3-prod
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
          comment: 'false'
      - name: Surface unavailable size report
        if: steps.dx_budget.outcome == 'failure'
        run: |
          echo '::warning::Nuxt DX reporting failed. See the report step.'
          echo '### Nuxt DX report unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reporting failed. The deployment result is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      # Second gate, and the only one that works without a D1-scoped token.
      # `server/checks/database.ts` runs inside the Worker this job just
      # shipped, so it reads the live schema through the `DB` binding. Read it
      # once here. A schema that lags the code now turns a silent outage into a
      # red run within seconds of the deploy.
      - name: Verify the production D1 schema
        timeout-minutes: 3
        env:
          CHECKIN_TOKEN: ${{ secrets.NUXT_CHECKIN_TOKEN }}
          CHECKIN_URL: https://requestindexing.com/api/internal/checkin
        run: |
          if [ -z "$CHECKIN_TOKEN" ]; then
            echo '::error::NUXT_CHECKIN_TOKEN is not set. Add the repository secret, then re-run this job.'
            exit 1
          fi
          if ! report=$(curl -fsS --max-time 30 --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CHECKIN_TOKEN" "$CHECKIN_URL"); then
            echo '::error::The check-in endpoint gave no answer. Check the deployed Worker and the token.'
            exit 1
          fi
          result=$(printf '%s' "$report" \
            | jq -r '.results[] | select(.id == "request-indexing.database") | .result._tag')
          if [ "$result" = 'Pass' ]; then
            exit 0
          fi
          if [ -z "$result" ]; then
            echo '::error::The check-in report holds no request-indexing.database result. The deployed Worker is not healthy.'
            exit 1
          fi
          reason=$(printf '%s' "$report" \
            | jq -r '.results[] | select(.id == "request-indexing.database") | .result.reason // "no reason given"')
          echo "::error::The production D1 schema check returned $result. $reason"
          {
            echo '### The production D1 schema check failed'
            echo "Result: \`$result\`."
            echo "Reason: $reason"
            echo 'If migrations are pending, run `pnpm db:migrate` with a D1-scoped token.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
