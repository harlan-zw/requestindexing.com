trustPolicy: no-downgrade
trustPolicyExclude:
  # Nuxt 4.6.1 resolves this exact cssnano group. pnpm reports each release as a
  # trust downgrade, although each one has npm provenance and a trusted publisher.
  - cssnano-preset-default@9.6.0
  - cssnano-utils@9.0.0
  - cssnano@9.6.0
  - postcss-colormin@9.0.8
  - postcss-convert-values@9.0.9
  - postcss-discard-comments@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-empty@9.0.8
  - postcss-discard-overridden@9.0.6
  - postcss-merge-longhand@9.4.0
  - postcss-merge-rules@9.1.4
  - postcss-minify-font-values@9.0.9
  - postcss-minify-gradients@9.0.8
  - postcss-minify-params@9.0.8
  - postcss-minify-selectors@9.0.8
  - postcss-normalize-charset@9.0.6
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-url@9.0.7
  - postcss-normalize-whitespace@9.0.8
  - postcss-ordered-values@9.0.9
  - postcss-reduce-initial@9.0.7
  - postcss-reduce-transforms@9.0.6
  - postcss-svgo@9.0.6
  - postcss-unique-selectors@9.0.6
  - stylehacks@9.0.8
  # Nuxt's vite-plugin-checker still resolves this release without provenance.
  - chokidar@4.0.3
  # Existing Babel transitive predates npm provenance.
  - semver@6.3.1
  # Existing Wrangler 3/Miniflare transitive. This release predates npm
  # provenance for undici; keep the exception exact so newer versions remain
  # covered by the no-downgrade policy.
  - undici@5.29.0

autoInstallPeers: false
shellEmulator: true

packages:
  - apps/*
  - layers/*

overrides:
  oxc-parser: 'catalog:'
  # Pin Rolldown so Nitro builds use a reproducible bundle.
  rolldown: 1.2.11
  sharp: 0.35.5
  unplugin: 'catalog:'
  # Vitest accepts this release, which has provenance. Version 3.2.2 does not.
  vitest@5>why-is-node-running: 3.2.1

  # SSR must use one Vue instance. A second peer context loses Nuxt's
  # injection context during prerender.
  vue: 3.5.43

patchedDependencies:
  '@nuxt/ui@4.11.2': patches/@nuxt__ui@4.11.2.patch
  nitropack@2.13.4: patches/nitropack@2.13.4.patch
  nuxt-auth-utils@0.5.30: patches/nuxt-auth-utils@0.5.30.patch
  zod@4.6.6: patches/zod@4.6.6.patch

allowBuilds:
