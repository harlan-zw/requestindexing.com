minimumReleaseAgeExclude:
  - '@harlan-zw/nuxt-checkin@0.3.0'
  - '@harlan-zw/nuxt-cloudflare@0.4.3'
  - '@harlan-zw/nuxt-sentry@0.1.7'
  - nuxt-ai-ready@1.7.9
  - '@harlan-zw/comark-content@0.1.2'
  - '@harlan-zw/nuxt-domain-events@0.1.1'
  - '@harlan-zw/nuxt-dx@0.1.3'
  - '@harlan-zw/nuxt-use-query@0.1.0'
  - '@harlan-zw/nuxt-wide-events@0.1.0'
  - nuxt-skew-protection@1.4.3
  - '@gscdump/contracts@4.5.0'
  - '@gscdump/engine@4.5.0'
  - '@gscdump/lakehouse@4.5.0'
  - '@gscdump/sdk@4.5.0'
  - gscdump@4.5.0
  - '@vitejs/plugin-vue@6.0.9'

shellEmulator: true
autoInstallPeers: false

trustPolicy: no-downgrade
trustPolicyExclude:
  # Nuxt's vite-plugin-checker still resolves this release without provenance.
  - chokidar@4.0.3
  # Existing Babel transitive predates npm provenance.
  - semver@6.3.1
  # Existing Wrangler 3/Miniflare transitive. This release predates npm
  # provenance for undici; keep the exception exact so newer versions remain
  # covered by the no-downgrade policy.
  - undici@5.29.0

packages:
  - apps/*
  - layers/*

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  maplibre-gl: true
  protobufjs: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  oxc-parser: 'catalog:'
  # Keep Nitro's Worker bundle reproducible on the version proven by
  # nuxtseo.com instead of floating across Rolldown patch releases.
  rolldown: 1.2.3
  sharp: 0.35.3
  unplugin: 'catalog:'
  # SSR must use one Vue instance. A second peer context loses Nuxt's
  # injection context during prerender.
  vue: 3.5.41
patchedDependencies:
  '@nuxt/ui@4.11.1': patches/@nuxt__ui@4.11.1.patch
  nuxt@4.5.2: patches/nuxt@4.5.2.patch
