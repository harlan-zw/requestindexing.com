name = "request-indexing"
account_id = "5904138d55ca25d5670dca6adf99894e"
compatibility_date = "2026-08-11"
# nodejs_compat v1. @harlan-zw/nuxt-cloudflare resolves the flag pair Cloudflare
# accepts, so `nodejs_compat_v2` here produces v2 alone with no rejected deploy.
compatibility_flags = [ "nodejs_compat" ]
workers_dev = false
preview_urls = false
upload_source_maps = true

[placement]
mode = "smart"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# 100% on purpose. Wide events are written to stdout, so Workers Logs is where
# the per-request records are read. Sampling them below 1 loses the telemetry.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[assets]
html_handling = "drop-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "request-indexin-bw2z"
database_id = "233eb802-c278-4900-9dcb-7f0316eed6b4"
migrations_dir = "layers/core/server/db/migrations"

[[r2_buckets]]
binding = "BLOB"
bucket_name = "request-indexin-bw2z"

[[kv_namespaces]]
binding = "KV"
id = "9ba09cd123b948f6835f5d20b2d97f6c"

[[kv_namespaces]]
binding = "CACHE"
id = "9aa5f0d4250c45ffa75d7bed3646ea30"

# Rest of config (crons, vars, etc.) is in nuxt.config.ts
